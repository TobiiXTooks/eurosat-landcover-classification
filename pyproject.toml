[project]
name = "eurosat-dl"
version = "0.1.0"
description = "Deep Learning project on EuroSAT: from-scratch CNN (RGB, src/cnn) plus a transfer-learning EfficientNet-B0 baseline (with_help/ + shared lib/)."
readme = "README.md"
# Pin to Python 3.12: PyTorch wheel support is more reliable on 3.12 than on newer interpreters.
requires-python = ">=3.12,<3.13"
dependencies = [
    # shared / new src/cnn (RGB) pipeline
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "numpy",
    "pandas",
    "scikit-learn>=1.7.2",
    "matplotlib>=3.10.9",
    "pillow",
    "tqdm",
    "pyyaml",
    # legacy lib/ + with_help/ (multispectral) pipeline
    "nnfs>=0.5.1",
    "pydantic>=2.13.3",
    "rasterio>=1.4.4",
    "scikit-image>=0.25.2",
    "tensorflow>=2.18.0",
]

[project.scripts]
eurosat-prepare-data = "cnn.prepare_data:main"
eurosat-train = "cnn.train:main"
eurosat-evaluate = "cnn.evaluate:main"
eurosat-experiments = "cnn.experiments:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Install BOTH packages: cnn (from src/cnn) and the legacy shared lib/.
[tool.hatch.build.targets.wheel]
packages = ["src/cnn", "lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "jupyter",
    "ipykernel",
    "debugpy>=1.8.20",
    "pytest",
]

# Course-practical experiment campaign for prompt.md section 7.
#
# Ablations are validation-only. The runner selects the best E1-E5 row by
# val_macro_f1 (tie: lower best_val_loss), then reruns final multiclass and
# binary models with test metrics enabled.

campaign_id: course_practical
base_config: configs/scratch_cnn.yaml
processed_dir: data/processed
output_root: outputs/experiments

experiments:
  - id: E0_overfit_100
    phase: sanity
    task: multiclass
    evaluate_test: false
    overfit_samples: 100
    overrides:
      model:
        dropout: 0.0
      optimizer:
        name: adam
        lr: 1.0e-3
        weight_decay: 0.0
      training:
        max_epochs: 50
        early_stopping_patience: 50
      augmentation:
        random_horizontal_flip: false
        random_vertical_flip: false
        random_rotation_degrees: 0

  - id: E1_baseline_no_aug
    phase: ablation
    task: multiclass
    evaluate_test: false
    overrides:
      model:
        dropout: 0.0
      optimizer:
        name: adam
        lr: 1.0e-3
        weight_decay: 0.0
      augmentation:
        random_horizontal_flip: false
        random_vertical_flip: false
        random_rotation_degrees: 0

  - id: E2_augmentation
    phase: ablation
    task: multiclass
    evaluate_test: false
    overrides:
      model:
        dropout: 0.0
      optimizer:
        name: adam
        lr: 1.0e-3
        weight_decay: 0.0
      augmentation:
        random_horizontal_flip: true
        random_vertical_flip: true
        random_rotation_degrees: 15

  - id: E3_regularized
    phase: ablation
    task: multiclass
    evaluate_test: false
    overrides:
      model:
        dropout: 0.3
      optimizer:
        name: adam
        lr: 1.0e-3
        weight_decay: 1.0e-4
      augmentation:
        random_horizontal_flip: true
        random_vertical_flip: true
        random_rotation_degrees: 15

  - id: E4_sgd_momentum
    phase: ablation
    task: multiclass
    evaluate_test: false
    overrides:
      model:
        dropout: 0.3
      optimizer:
        name: sgd
        lr: 1.0e-2
        momentum: 0.9
        weight_decay: 1.0e-4
      augmentation:
        random_horizontal_flip: true
        random_vertical_flip: true
        random_rotation_degrees: 15

  - id: E5_depthwise_separable
    phase: ablation
    task: multiclass
    evaluate_test: false
    overrides:
      model:
        name: depthwise_separable_cnn
        dropout: 0.3
      optimizer:
        name: sgd
        lr: 1.0e-2
        momentum: 0.9
        weight_decay: 1.0e-4
      augmentation:
        random_horizontal_flip: true
        random_vertical_flip: true
        random_rotation_degrees: 15

final:
  tasks:
    - multiclass
    - binary
